<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>评测看板</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem("eval-mode");
      var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.mode = saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light";
    } catch (e) {}
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%23d35e2c'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%23dfe3e8'/%3E%3Crect x='17' y='1' width='6' height='6' rx='1.5' fill='%23a01e26'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%23dfe3e8'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23d35e2c'/%3E%3Crect x='17' y='9' width='6' height='6' rx='1.5' fill='%23dfe3e8'/%3E%3C/svg%3E">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/core.js">
<link rel="modulepreload" href="js/pixel_toggle.js">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/data.css">
<link rel="stylesheet" href="css/speed.css">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/judge.css">
<link rel="stylesheet" href="css/bench.css">
<link rel="stylesheet" href="css/samples.css">
<link rel="stylesheet" href="css/abtest.css">

<link rel="stylesheet" href="css/docs.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<header class="top">
  <div class="top-mid">
  <div class="brand" role="img" aria-label="评测看板"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
  <nav class="seg" id="viewSwitch" aria-label="页面">
    <span class="seg-knob" aria-hidden="true"></span>
    <button type="button" data-value="data">数据看板</button>
    <button type="button" data-value="speed">评测速度</button>
    <button type="button" data-value="system">评测体系</button>
    <button type="button" data-value="judge">评测评测</button>
    <button type="button" data-value="bench">Bench</button>
    <button type="button" data-value="samples">具体数据</button>
    <button type="button" data-value="forecast">预测数据</button>
    <button type="button" data-value="compare">版本对比</button>
    <button type="button" data-value="docs">文档</button>
  </nav>
  </div>
  <div class="top-end">
  <time class="stamp num" id="stamp" hidden title="数据生成时间，每 2 分钟检查更新"></time>
  <div class="seg" id="productSwitch" role="group" aria-label="产品">
    <span class="seg-knob" aria-hidden="true"></span>
    <button type="button" data-value="wencai"><small class="seg-loc">乌兰察布</small><span>问财</span></button>
    <button type="button" data-value="aime"><small class="seg-loc">弗吉尼亚</small><span>AIME</span></button>
  </div>
  <button class="px-toggle" id="themeToggle" type="button" role="switch" aria-label="日间模式"></button>
  </div>
</header>
<div class="net" id="net" role="status" aria-live="polite" hidden><i aria-hidden="true"></i><span id="netText"></span></div>

<main id="main" tabindex="-1">
  <section class="view" data-view="data" aria-label="数据看板"></section>
  <section class="view" data-view="speed" aria-label="评测速度"></section>
  <section class="view" data-view="system" aria-label="评测体系"></section>
  <section class="view" data-view="judge" aria-label="评测评测"></section>
  <section class="view" data-view="bench" aria-label="Bench"></section>
  <section class="view" data-view="samples" aria-label="具体数据"></section>
  <section class="view" data-view="forecast" aria-label="预测数据"></section>
  <section class="view" data-view="compare" aria-label="版本对比"></section>
  <section class="view" data-view="docs" aria-label="文档"></section>
</main>

<div class="tip" id="tip" role="tooltip"></div>
<div class="sr-only" id="announcer" aria-live="polite"></div>
<div class="mask" id="mask" role="status" aria-label="正在加载"><div class="bento mask-skel" aria-hidden="true">
  <div class="card skel-card" style="--span:3;height:132px"><span class="skel skel-title"></span><span class="skel" style="flex:1"></span></div>
  <div class="card skel-card" style="--span:3;height:132px"><span class="skel skel-title"></span><span class="skel" style="flex:1"></span></div>
  <div class="card skel-card" style="--span:3;height:132px"><span class="skel skel-title"></span><span class="skel" style="flex:1"></span></div>
  <div class="card skel-card" style="--span:3;height:132px"><span class="skel skel-title"></span><span class="skel" style="flex:1"></span></div>
  <div class="card skel-card" style="--span:8;height:360px"><span class="skel skel-title"></span><span class="skel" style="flex:1"></span></div>
  <div class="card skel-card" style="--span:4;height:360px"><span class="skel skel-title"></span><span class="skel" style="flex:1"></span></div>
</div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
