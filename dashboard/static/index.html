<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>评测看板</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem("eval-mode");
      var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.mode = saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light";
    } catch (e) {}
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%23d35e2c'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%23dfe3e8'/%3E%3Crect x='17' y='1' width='6' height='6' rx='1.5' fill='%23a01e26'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%23dfe3e8'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23d35e2c'/%3E%3Crect x='17' y='9' width='6' height='6' rx='1.5' fill='%23dfe3e8'/%3E%3C/svg%3E">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/core.js">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>评测看板</div>
  <nav class="seg" id="viewSwitch" aria-label="页面">
    <span class="seg-knob" aria-hidden="true"></span>
    <button type="button" data-value="data">数据看板</button>
    <button type="button" data-value="system">评测体系</button>
    <button type="button" data-value="samples">具体数据</button>
  </nav>
  <span class="top-spacer"></span>
  <time class="stamp num" id="stamp" hidden title="数据生成时间，每 2 分钟检查更新"></time>
  <div class="seg" id="productSwitch" role="group" aria-label="产品">
    <span class="seg-knob" aria-hidden="true"></span>
    <button type="button" data-value="wencai">问财</button>
    <button type="button" data-value="aime">AIME</button>
  </div>
  <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深色模式">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M21 12h-2M5 12H3M18.4 5.6 17 7M7 17l-1.4 1.4M18.4 18.4 17 17M7 7 5.6 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
</header>

<main id="main" tabindex="-1">
  <section class="view" data-view="data" aria-label="数据看板"></section>
  <section class="view" data-view="system" aria-label="评测体系"></section>
  <section class="view" data-view="samples" aria-label="具体数据"></section>
</main>

<div class="tip" id="tip" role="tooltip"></div>
<div class="sr-only" id="announcer" aria-live="polite"></div>
<div class="mask" id="mask"><div class="loader" aria-label="正在加载"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
